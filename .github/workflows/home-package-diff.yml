name: Home Manager package diff

on:
  pull_request:
    paths:
      - flake.lock

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate Home Manager packages
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # No secrets or write token: evaluating a flake can execute PR-controlled code.
      - id: packages
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const configurations = ['linux', 'macos'];
          const packages = {};
          for (const configuration of configurations) {
            packages[configuration] = {};
            for (const revision of ['base', 'head']) {
              try {
                const output = execFileSync('nix', [
                  'eval', '--json', '--no-write-lock-file',
                  `./${revision}#homeConfigurations.${configuration}.config.home.packages`,
                  '--apply', `packages: map (package: {
                    name = package.pname or (builtins.parseDrvName package.name).name;
                    version = package.version or (builtins.parseDrvName package.name).version;
                  }) packages`,
                ], { encoding: 'utf8', maxBuffer: 4 * 1024 * 1024 });
                packages[configuration][revision] = JSON.parse(output);
              } catch {
                console.log(`::warning::Could not evaluate ${configuration} (${revision}); see Nix logs.`);
                packages[configuration][revision] = null;
              }
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(packages)}\n`);
          NODE

  comment:
    name: Comment package changes
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Deliberately no checkout or execution of code from the PR in this job.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGES: ${{ needs.evaluate.outputs.packages }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- home-manager-package-diff -->';
            const packages = JSON.parse(process.env.PACKAGES);
            // Package metadata is untrusted. Escape Markdown/HTML and mentions.
            const escape = (value) => String(value).replace(
              /[&<>"'`|*_[\]\\@\r\n]/g,
              (character) => `&#${character.charCodeAt(0)};`,
            );
            const index = (items) => {
              if (!Array.isArray(items)) throw new Error('Invalid package list');
              const result = new Map();
              for (const item of items) {
                if (typeof item.name !== 'string' || typeof item.version !== 'string') {
                  throw new Error('Invalid package metadata');
                }
                if (!result.has(item.name)) result.set(item.name, new Set());
                result.get(item.name).add(item.version || '(version unknown)');
              }
              return new Map([...result].map(([name, versions]) => [
                name, [...versions].sort().join(', '),
              ]));
            };
            const sections = [
              marker,
              '## Home Manager package changes',
              `Commit: ${process.env.HEAD_SHA}`,
              'Compares `home.packages` in the PR base and head (not transitive dependencies).',
            ];
            const configurations = [['linux', 'Linux'], ['macos', 'macOS']];
            const changes = new Map();
            for (const [configuration, label] of configurations) {
              const revisions = packages[configuration];
              const failed = ['base', 'head'].filter((revision) => revisions[revision] === null);
              if (failed.length) {
                sections.push('', `⚠️ ${label}: evaluation failed (${failed.join(', ')}). No comparison available; see the workflow logs.`);
                continue;
              }
              const before = index(revisions.base);
              const after = index(revisions.head);
              const names = new Set([...before.keys(), ...after.keys()]);
              for (const name of names) {
                if (before.get(name) === after.get(name)) continue;
                if (!changes.has(name)) changes.set(name, new Map());
                const transitions = changes.get(name);
                const key = JSON.stringify([before.get(name) ?? null, after.get(name) ?? null]);
                if (!transitions.has(key)) transitions.set(key, []);
                transitions.get(key).push(label);
              }
            }
            sections.push('');
            if (!changes.size) {
              sections.push('No package version changes in the successfully evaluated configurations.');
            } else {
              sections.push('| Package | Version |', '| --- | --- |');
              // Stay below GitHub's comment size limit, even for unexpected metadata.
              let budget = 55000;
              let omitted = 0;
              const version = (value) => value === null ? '—' : `\`${escape(value)}\``;
              for (const name of [...changes.keys()].sort()) {
                const lines = [...changes.get(name)].map(([key, labels]) => {
                  const [before, after] = JSON.parse(key);
                  const suffix = labels.length === configurations.length ? '' : ` (${labels.join(', ')})`;
                  return `${version(before)} → ${version(after)}${suffix}`;
                });
                const row = `| ${escape(name)} | ${lines.join('<br/>')} |`;
                if (row.length > budget) {
                  omitted++;
                  continue;
                }
                sections.push(row);
                budget -= row.length;
              }
              if (omitted) sections.push('', `${omitted} additional changes omitted (comment size limit).`);
            }
            sections.push(
              '',
              '— = package added or removed. Packages without version metadata are marked as unknown.',
              'Same-version rebuilds and changes inside package wrappers are not shown.',
            );
            const body = sections.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Do not post a stale result if Renovate pushed again during evaluation.
            const { data: pull } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number,
            });
            if (pull.state !== 'open' || pull.head.sha !== process.env.HEAD_SHA) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
