name: Lint

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLICOLOR: 1

jobs:
  changes:
    name: Detect lint changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fmt: ${{ steps.filter.outputs.fmt }}
      nix: ${{ steps.filter.outputs.nix }}
      node: ${{ steps.filter.outputs.node }}
      crates: ${{ steps.rust.outputs.changes }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            fmt:
              - '.github/workflows/lint.yml'
              - 'treefmt.toml'
              - '.oxfmtrc.json'
              - 'stylua.toml'
              - '**/*.nix'
              - '**/*.rs'
              - '**/*.ts'
              - '**/*.mts'
              - '**/*.json'
              - '**/*.sh'
              - '**/*.lua'
              - '**/*.toml'
            nix:
              - '.github/workflows/lint.yml'
              - 'flake.lock'
              - '**/*.nix'
            node:
              - '.github/workflows/lint.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - '.oxlintrc.json'
              - '**/*.ts'
              - '**/*.mts'
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: rust
        with:
          filters: |
            agent-sessions:
              - &rust-shared
                - '.github/workflows/lint.yml'
                - 'flake.lock'
                - 'Cargo.toml'
                - 'Cargo.lock'
                - 'apps/rust-*.nix'
              - 'apps/agent-sessions/**'
            claude-statusline:
              - *rust-shared
              - 'apps/claude-statusline/**'
            command-library:
              - *rust-shared
              - 'apps/command-library/**'
            git-autocommit:
              - *rust-shared
              - 'apps/git-autocommit/**'
            herdr-subagents:
              - *rust-shared
              - 'apps/herdr-subagents/**'
            worktree:
              - *rust-shared
              - 'apps/worktree/**'

  treefmt:
    name: treefmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.fmt == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-treefmt-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-treefmt-${{ runner.os }}-
      - run: nix fmt -- --fail-on-change

  deadnix:
    name: deadnix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-deadnix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-deadnix-${{ runner.os }}-
      - run: nix build .#checks.x86_64-linux.deadnix

  statix:
    name: statix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-statix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-statix-${{ runner.os }}-
      - run: nix build .#checks.x86_64-linux.statix

  oxlint:
    name: oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.node == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-oxlint-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-oxlint-${{ runner.os }}-
      - run: nix build .#checks.x86_64-linux.oxlint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.node == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  clippy:
    name: clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
    if: ${{ needs.changes.outputs.crates != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-clippy-${{ runner.os }}-${{ hashFiles('**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-clippy-${{ runner.os }}-
      - run: nix build -L ".#checks.x86_64-linux.rust-clippy-$CRATE"
        env:
          CRATE: ${{ matrix.crate }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-actionlint-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-actionlint-${{ runner.os }}-
      - run: nix build .#checks.x86_64-linux.actionlint

  all-lint-passed:
    name: All Lint Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - treefmt
      - deadnix
      - statix
      - oxlint
      - typecheck
      - clippy
      - actionlint
    if: ${{ always() }}
    steps:
      - name: Verify all lint jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more jobs failed or were cancelled: $RESULTS"
            exit 1
          fi
