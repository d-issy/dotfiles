name: Nix Build

permissions:
  contents: read
  pull-requests: read

on:
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLICOLOR: 1

jobs:
  changes:
    name: Detect Nix changes
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            nix:
              - 'flake.lock'
              - '**/*.nix'

  home-manager-activation-package:
    name: Home Manager activationPackage (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: linux
            os: ubuntu-latest
            attr: .#homeConfigurations.linux.activationPackage
          - config: macos (without Nixvim)
            os: macos-latest
            attr: .#homeConfigurations.macos_ci.activationPackage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build ${{ matrix.attr }}

  nixos-configuration:
    name: NixOS configuration (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: nixos
            attr: .#nixosConfigurations.nixos.config.system.build.toplevel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build ${{ matrix.attr }}

  all-nix-build-passed:
    name: All Nix Build Passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - home-manager-activation-package
      - nixos-configuration
    if: ${{ always() }}
    steps:
      - name: Verify all Nix build jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more jobs failed or were cancelled: $RESULTS"
            exit 1
          fi
