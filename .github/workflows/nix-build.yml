name: Nix Build

permissions:
  contents: read
  pull-requests: read

on:
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLICOLOR: 1

jobs:
  changes:
    name: Detect Nix changes
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.lock'
              - '**/*.nix'
              - '.github/workflows/nix-build.yml'

  nix-flake-check:
    name: Nix flake check (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: linux
            os: ubuntu-latest
          - config: macos
            os: macos-latest
          - config: nixos
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check

  nix-build:
    name: Nix build (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: linux
            os: ubuntu-latest
            attr: .#homeConfigurations.linux.activationPackage
          - config: nixos
            os: ubuntu-latest
            attr: .#nixosConfigurations.nixos.config.system.build.toplevel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build ${{ matrix.attr }}

  all-nix-build-passed:
    name: All Nix Build Passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - nix-flake-check
      - nix-build
    if: ${{ always() }}
    steps:
      - name: Verify all Nix jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more jobs failed or were cancelled: $RESULTS"
            exit 1
          fi
