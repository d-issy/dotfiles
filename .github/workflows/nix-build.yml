name: Nix Build

permissions:
  contents: read

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLICOLOR: 1

jobs:
  changes:
    name: Detect Nix changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.lock'
              - '**/*.nix'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/**'
              - 'files/**'
              - 'tests/**'
              - 'treefmt.toml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'stylua.toml'
              - '.github/workflows/nix-build.yml'

  nix-flake-check:
    name: Nix flake check
    runs-on: ${{ matrix.config == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs:
      - changes
    strategy:
      fail-fast: false
      matrix:
        # Use one cheap no-op target when no Nix inputs changed.
        config: ${{ fromJSON(needs.changes.outputs.nix == 'true' && '["linux", "macos"]' || '["skip"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.config != 'skip' }}
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        if: ${{ matrix.config != 'skip' }}
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        if: ${{ matrix.config != 'skip' }}
        with:
          primary-key: nix-flake-check-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-flake-check-${{ runner.os }}-
      - run: nix flake check
        if: ${{ matrix.config != 'skip' }}

  all-nix-build-passed:
    name: All Nix Build Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - nix-flake-check
    if: ${{ always() }}
    steps:
      - name: Verify all Nix jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more jobs failed or were cancelled: $RESULTS"
            exit 1
          fi
