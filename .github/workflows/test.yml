name: Test

permissions:
  contents: read

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLICOLOR: 1

jobs:
  changes:
    name: Detect test changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # JSON list of the Vitest projects whose files changed.
      projects: ${{ steps.filter.outputs.changes }}
      crates: ${{ steps.rust.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Filter names are Vitest project names (see vitest.config.mts).
          filters: |
            pi:
              - &shared
                - 'package.json'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'tsconfig.json'
                - 'vitest.config.mts'
                - '.github/workflows/test.yml'
              - 'files/pi/**/*.ts'
              - 'tests/pi/**/*.ts'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: rust
        with:
          filters: |
            agent-sessions:
              - &rust-shared
                - '.github/workflows/test.yml'
                - 'flake.lock'
                - 'Cargo.toml'
                - 'Cargo.lock'
                - 'apps/rust-*.nix'
                - 'apps/dot/**'
              - 'apps/agent-sessions/**'
            claude-statusline:
              - *rust-shared
              - 'apps/claude-statusline/**'
            command-library:
              - *rust-shared
              - 'apps/command-library/**'
            dot:
              - *rust-shared
            git-autocommit:
              - *rust-shared
              - 'apps/git-autocommit/**'
            herdr-subagents:
              - *rust-shared
              - 'apps/herdr-subagents/**'
            tm-switcher:
              - *rust-shared
              - 'apps/tm-switcher/**'
            tmux-notice:
              - *rust-shared
              - 'apps/tmux-notice/**'
            worktree:
              - *rust-shared
              - 'apps/worktree/**'

  test:
    name: pnpm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    strategy:
      fail-fast: false
      matrix:
        # A no-op target keeps the job name readable when no projects changed.
        project: ${{ fromJSON(needs.changes.outputs.projects != '[]' && needs.changes.outputs.projects || '["skip"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.project != 'skip' }}
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ matrix.project != 'skip' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.project != 'skip' }}
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ matrix.project != 'skip' }}
      - run: pnpm test --project "$PROJECT"
        if: ${{ matrix.project != 'skip' }}
        env:
          PROJECT: ${{ matrix.project }}

  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
    strategy:
      fail-fast: false
      matrix:
        # A no-op target keeps the job name readable when no crates changed.
        crate: ${{ fromJSON(needs.changes.outputs.crates != '[]' && needs.changes.outputs.crates || '["skip"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.crate != 'skip' }}
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: ${{ matrix.crate != 'skip' }}
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        if: ${{ matrix.crate != 'skip' }}
        with:
          primary-key: nix-cargo-test-${{ runner.os }}-${{ hashFiles('**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-cargo-test-${{ runner.os }}-
      - run: nix build -L ".#checks.x86_64-linux.rust-test-$CRATE"
        if: ${{ matrix.crate != 'skip' }}
        env:
          CRATE: ${{ matrix.crate }}

  all-test-passed:
    name: All Test Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - test
      - cargo-test
    if: ${{ always() }}
    steps:
      - name: Verify all test jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more jobs failed or were cancelled: $RESULTS"
            exit 1
          fi
