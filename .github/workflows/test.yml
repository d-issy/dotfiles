name: Test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLICOLOR: 1

jobs:
  changes:
    name: Detect test changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # JSON list of the Vitest projects whose files changed.
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Filter names are Vitest project names (see vitest.config.mts).
          filters: |
            pi:
              - &shared
                - 'package.json'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'tsconfig.json'
                - 'vitest.config.mts'
                - '.github/workflows/test.yml'
              - 'files/pi/**/*.ts'
              - 'tests/pi/**/*.ts'
            agent-sessions:
              - *shared
              - 'apps/agent-sessions/**/*.ts'
              - 'tests/agent-sessions/**/*.ts'
            command-library:
              - *shared
              - 'apps/command-library/**/*.ts'
              - 'tests/command-library/**/*.ts'

  test:
    name: pnpm test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.projects != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}

  all-test-passed:
    name: All Test Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - test
    if: ${{ always() }}
    steps:
      - name: Verify all test jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more jobs failed or were cancelled: $RESULTS"
            exit 1
          fi
