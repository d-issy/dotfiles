[global]
excludes = [
  "*.lock",
  "node_modules/**",
  ".direnv/**",
  ".pnpm-store/**",
  "target/**",
]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--no-error-on-unmatched-pattern"]
includes = ["*.ts", "*.mts"]

[formatter.rust]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

[formatter.sh]
command = "shfmt"
options = ["-w"]
includes = ["*.sh"]

[formatter.stylua]
command = "stylua"
includes = ["*.lua"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
