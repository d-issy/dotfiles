[workspace]
resolver = "3"
members = [
  "apps/agent-sessions",
  "apps/claude-statusline",
  "apps/command-library",
  "apps/git-autocommit",
  "apps/herdr-subagents",
  "apps/tmux-notice",
  "apps/worktree",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = true
